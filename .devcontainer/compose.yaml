# Dev Container stack for the INATrace workspace.
#
#   app   the toolchain image built from .devcontainer/Dockerfile. This is the
#         container `devcontainer exec` attaches to, and where the platform and
#         every repo under /workspace/repos are worked on.
#
# `.env` (host paths for the bind mounts, the settings below) is generated by
# `.devcontainer/initialize.py` on the host before this file is read, from the host and from
# your settings in the repo root's .env. It is git-ignored and should not be
# edited by hand.

# INATRACE_INSTANCE (root .env, default inatrace-platform) names the project and
# its volumes, so a second checkout can run beside this one without sharing them.
name: ${DC_INSTANCE}

services:
  app:
    # The Dockerfile COPYs nothing; .devcontainer/ as the context keeps the repo
    # and its clones out of the build.
    build:
      context: .

    # A dev container needs a process that stays up for the tooling to attach to.
    command: sleep infinity
    # Reap the zombies that `sleep infinity` as PID 1 would otherwise collect.
    init: true

    # ---- docker-in-docker + SSH agent relay ----
    # Starts the nested Docker daemon and the SSH agent relay, then execs
    # `command`. See "Container init" in the Dockerfile.
    entrypoint: /usr/local/share/container-init.sh
    # dockerd needs to create cgroups, mount filesystems and program iptables,
    # none of which an unprivileged container may do.
    privileged: true

    # SELinux hosts (Fedora/RHEL): without this every bind mount is denied. The
    # `:z`/`:Z` suffixes would RELABEL the host paths instead, which breaks the
    # desktop sockets for the host session. No-op on hosts without SELinux.
    security_opt:
      - label=disable

    volumes:
      # The ONLY workspace mount: the whole repo becomes /workspace, so the
      # platform itself is a git repo in here too. The cloned repos live in
      # repos/ (git-ignored).
      - ..:/workspace:cached

      # The whole home directory is a named volume: Claude Code state, shell
      # history, caches (~/.m2, ~/.npm), nvm, ~/.ssh/known_hosts, gh login and
      # IDE backends all survive a rebuild. The image puts nothing in $HOME;
      # `.devcontainer/provision.py` installs and configures what lives there, idempotently.
      - home:/home/dev
      # Storage for the NESTED Docker daemon (images, containers, MySQL data).
      # Must be a volume: overlay2 refuses to run on the container's own
      # overlayfs.
      - docker:/var/lib/docker

      # ---- Host files and directories ----
      # Long syntax with create_host_path: false — if a source ever goes missing,
      # Docker fails instead of silently creating a root-owned directory in its
      # place on the host. `.devcontainer/initialize.py` resolves every source (or a
      # placeholder).
      #
      # Sockets are reached through their STABLE DIRECTORIES, never mounted one by
      # one: socket files are recreated (and renamed) across host sessions, and a
      # directory bind shows the new ones live, with no container recreation.

      # Host git identity, included by the container's writable git config.
      - type: bind
        source: ${HOST_GITCONFIG}
        target: /home/dev/.gitconfig.host
        read_only: true
        bind: { create_host_path: false }
      # OpenSSH >= 10.1 agent sockets (~/.ssh/agent/s.<random>). Keys stay on the
      # host; the relay on SSH_AUTH_SOCK picks the live socket per connection.
      - type: bind
        source: ${HOST_SSH_AGENT_DIR}
        target: /tmp/host-ssh-agent
        bind: { create_host_path: false }
      # The host session's runtime dir ($XDG_RUNTIME_DIR): Wayland (clipboard,
      # headed browser), PulseAudio/PipeWire (microphone for /voice) and the
      # agents that keep a fixed socket there (systemd, GNOME, gpg-agent).
      # Best-effort: an empty placeholder directory on a host without a session.
      - type: bind
        source: ${HOST_RUNTIME_DIR}
        target: /tmp/host-runtime
        bind: { create_host_path: false }

    environment:
      # The relay socket (see container-init in the Dockerfile).
      SSH_AUTH_SOCK: /tmp/ssh-agent.sock
      PULSE_SERVER: unix:/tmp/host-runtime/pulse/native
      # libwayland treats an ABSOLUTE WAYLAND_DISPLAY as a literal path.
      WAYLAND_DISPLAY: /tmp/host-runtime/${HOST_WAYLAND_DISPLAY}
      # Wayland clients need a private runtime dir of their own (mode 0700,
      # owned by `dev`); the Dockerfile creates it.
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
      # "true" when the host has no Wayland session (decided by `.devcontainer/initialize.py`;
      # set PLAYWRIGHT_HEADLESS in the root .env to force it). Read by `.devcontainer/provision.py`.
      PLAYWRIGHT_HEADLESS: ${DC_PLAYWRIGHT_HEADLESS}

    # [address:]host:container. Services must bind 0.0.0.0 INSIDE the container
    # to be reachable (`ng serve --host 0.0.0.0`). On the host they are published
    # on 127.0.0.1 only: IPv4, and not exposed to the network — dev servers have
    # no business on the LAN. `.devcontainer/initialize.py` writes the values to .env
    # from the root .env (INATRACE_BIND_ADDRESS, default 127.0.0.1;
    # INATRACE_GATEWAY_PORT / INATRACE_BACKEND_PORT / INATRACE_FRONTEND_PORT,
    # defaults 8000/9000/9080) and recreates the container when they change.
    # Use the gateway; the direct ports are for debugging.
    ports:
      - "${DC_BIND_ADDRESS}:${DC_GATEWAY_PORT}:8000"    # dev gateway (dev-stack): / and /api
      - "${DC_BIND_ADDRESS}:${DC_BACKEND_PORT}:8080"    # inatrace-backend (Spring Boot)
      - "${DC_BIND_ADDRESS}:${DC_FRONTEND_PORT}:4200"   # inatrace-frontend (ng serve)

volumes:
  # `name:` pins the exact volume name: <instance>-home and <instance>-docker.
  # Deliberately NOT the inatrace-* names of the older inatrace-devcontainer: two
  # nested daemons sharing one /var/lib/docker would corrupt it. See docs/dev-container.md →
  # Coming from inatrace-devcontainer.
  home:
    name: ${DC_INSTANCE}-home
  docker:
    name: ${DC_INSTANCE}-docker
