# Dev gateway routing. Listens on 8000 inside the dev container, published on
# the host as INATRACE_GATEWAY_PORT (default 8000).
#
#   /api/*                     -> inatrace-backend  (Spring Boot, localhost:8080)
#   /v3/api-docs, /swagger-ui* -> inatrace-backend  (springdoc lives outside /api)
#   everything else            -> inatrace-frontend (ng serve, localhost:4200)
#
# An upstream that is not running answers 502; start it and reload the page.

# WebSocket upgrade for the dev server's live reload.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8000;

  # The backend accepts uploads up to 10 MB.
  client_max_body_size 20m;

  proxy_http_version 1.1;
  # The backend builds absolute URLs from these (server.forward-headers-strategy).
  proxy_set_header X-Forwarded-Host  $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

  location /api/ {
    proxy_pass http://127.0.0.1:8080;
  }

  location ~ ^/(v3/api-docs|swagger-ui) {
    proxy_pass http://127.0.0.1:8080;
  }

  location / {
    proxy_pass http://127.0.0.1:4200;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
