# Dev gateway: the local stand-in for the production Ingress.
#
# One origin for the browser — `/api` goes to the backend, everything else to
# the frontend — exactly the routing production does, instead of the Angular
# dev server's own proxy. Started (idempotently) by /src/setup.sh; comes back
# with the nested Docker daemon thanks to the restart policy.
#
#   docker compose -f /src/gateway/compose.yaml up -d      # start / apply changes
#   docker compose -f /src/gateway/compose.yaml logs -f    # access log
#
# network_mode: host puts nginx in the dev container's network namespace, so the
# upstreams are plain localhost ports: `ng serve` and Spring Boot run natively
# in the dev container, and containers started with `-p` publish there too.
name: inatrace-gateway

services:
  gateway:
    image: nginx:stable-alpine
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
