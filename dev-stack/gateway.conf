# Dev gateway routing, on the host network. Listens on 8000 (in the dev
# container, published on the host as INATRACE_GATEWAY_PORT, default 8000).
#
#   /api/*                     -> backend  (localhost:8080: Spring Boot or its image)
#   /v3/api-docs, /swagger-ui* -> backend  (springdoc lives outside /api)
#   /mailpit/                  -> Mailpit  (the e-mails the backend sent)
#   everything else            -> frontend (localhost:4200: ng serve or its image)
#
# An upstream that is not running answers 502; start it and reload the page.

# WebSocket upgrade for the dev server's live reload.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8000;

  # The backend accepts uploads up to 10 MB.
  client_max_body_size 20m;

  proxy_http_version 1.1;
  # The backend builds absolute URLs from these (server.forward-headers-strategy).
  proxy_set_header X-Forwarded-Host  $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

  location /api/ {
    proxy_pass http://127.0.0.1:8080;
  }

  location ~ ^/(v3/api-docs|swagger-ui) {
    proxy_pass http://127.0.0.1:8080;
  }

  location /mailpit/ {
    proxy_pass http://127.0.0.1:8025;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location / {
    proxy_pass http://127.0.0.1:4200;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
