[pytest]
testpaths = tests
# tests/NN_area.py: the number sets the order (lifecycle last, it restarts services).
python_files = [0-9][0-9]_*.py
pythonpath = .
addopts = --import-mode=importlib -p no:cacheprovider -q --no-header --tb=no -rN
log_cli_format = %(asctime)s %(message)s
log_cli_date_format = %H:%M:%S
# A deployment by IP address has a self-signed certificate, which cannot be checked.
filterwarnings = ignore::urllib3.exceptions.InsecureRequestWarning
